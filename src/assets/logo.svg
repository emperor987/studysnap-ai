<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Cornière haut-gauche : bleu (haut) → violet/magenta (pointe droite) -->
    <linearGradient id="gTL" x1="132" y1="36" x2="36" y2="132" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4F6BFF"/>
      <stop offset="0.55" stop-color="#7C5CF6"/>
      <stop offset="1" stop-color="#9B5CF6"/>
    </linearGradient>
    <!-- Cornière haut-droite : violet (pointe gauche) → orange-rouge (bas) -->
    <linearGradient id="gTR" x1="284" y1="132" x2="380" y2="228" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#A855F7"/>
      <stop offset="0.55" stop-color="#E0696F"/>
      <stop offset="1" stop-color="#FF7A5C"/>
    </linearGradient>
    <!-- Cornière bas-gauche : bleu (bord vertical haut) → rose/magenta (pointe droite) -->
    <linearGradient id="gBL" x1="132" y1="284" x2="228" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4F6BFF"/>
      <stop offset="0.55" stop-color="#A86CF6"/>
      <stop offset="1" stop-color="#F472B6"/>
    </linearGradient>
    <!-- Cornière bas-droite : orange-rouge (pointe gauche) → orange vif (bord vertical) -->
    <linearGradient id="gBR" x1="284" y1="380" x2="380" y2="284" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FF6B4A"/>
      <stop offset="1" stop-color="#FF9A4A"/>
    </linearGradient>
    <!-- Cercle central : bleu-violet (haut-gauche) → magenta → orange-rouge (bas-droite) -->
    <radialGradient id="gCircle" cx="0.36" cy="0.32" r="0.9">
      <stop offset="0" stop-color="#6D6CF7"/>
      <stop offset="0.45" stop-color="#B45BF0"/>
      <stop offset="0.78" stop-color="#E15FD8"/>
      <stop offset="1" stop-color="#FF7A5C"/>
    </radialGradient>
    <!-- Point d'accent corail (haut-droite) -->
    <linearGradient id="gDot" x1="356" y1="160" x2="374" y2="178" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FF8A6B"/>
      <stop offset="1" stop-color="#FF5C5C"/>
    </linearGradient>
  </defs>

  <!-- Fond noir arrondi -->
  <rect x="0" y="0" width="512" height="512" rx="116" fill="#000000"/>

  <!-- Cornières du viseur (extrémités rondes, angle intérieur net) -->
  <g fill="none" stroke-width="44" stroke-linecap="round" stroke-linejoin="miter">
    <path d="M 132 36 L 132 132 L 36 132" stroke="url(#gTL)"/>
    <path d="M 284 132 L 380 132 L 380 228" stroke="url(#gTR)"/>
    <path d="M 132 284 L 132 380 L 228 380" stroke="url(#gBL)"/>
    <path d="M 284 380 L 380 380 L 380 284" stroke="url(#gBR)"/>
  </g>

  <!-- Cercle objectif -->
  <circle cx="256" cy="256" r="124" fill="url(#gCircle)"/>

  <!-- Point d'accent corail près de la cornière haut-droite -->
  <circle cx="364" cy="168" r="9" fill="url(#gDot)"/>

  <!-- Étoile blanche à 4 branches (côtés concaves, pointes hautes/basses longues) -->
  <path
    d="M 256 148 Q 282 238 334 256 Q 282 274 256 364 Q 230 274 178 256 Q 230 238 256 148 Z"
    fill="#FFFFFF"
  />
</svg>
