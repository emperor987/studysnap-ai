  <!-- Scan line accent -->
  <rect x="148" y="310" width="216" height="4" rx="2" fill="url(#g)" opacity="0.6"/>
  <!-- Sparkle accents -->
  <circle cx="380" cy="140" r="12" fill="white" opacity="0.7"/>
  <circle cx="400" cy="170" r="6" fill="white" opacity="0.5"/>
  <circle cx="132" cy="380" r="8" fill="white" opacity="0.5"/>
