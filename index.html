      {
        "@type": "Question",
        "name": "StudySnap est-il gratuit ?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Oui, StudySnap propose un mode démo avec 1 scan gratuit sans compte. La réponse rapide reste toujours gratuite. Les modes explication détaillée et génération de fiches de révision utilisent un système de crédits : des packs à partir de 1,99 € sont disponibles sans abonnement."
        }
      },
      {
        "@type": "Question",
        "name": "Quelles matières sont supportées par StudySnap ?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "StudySnap fonctionne avec toutes les matières scolaires du collège au lycée en France : Mathématiques, Physique-Chimie, SVT, Français, Histoire-Géographie, Anglais, et bien d'autres. L'IA détecte automatiquement la matière et le niveau."
        }
      },
      {
        "@type": "Question",
        "name": "Quelle est la différence entre les modes Réponse rapide, Explication et Révision ?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Réponse rapide : donne la réponse finale et l'essentiel en une ligne, gratuit. Explication : fournit une explication complète avec méthode, étapes numérotées, et erreurs fréquentes à éviter. Révision : génère une mini-leçon, des formules clés, des exercices similaires et un quiz personnalisé."
        }
      },
      {
        "@type": "Question",
        "name": "Que faire si l'explication ne me convient pas ?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Tu peux relancer l'analyse en changeant de mode (Réponse rapide → Explication → Révision). Si l'explication n'est toujours pas claire, ajuste le niveau de détail dans les paramètres de ton profil StudySnap."
        }
      },
      {
        "@type": "Question",
        "name": "Mes photos de devoirs sont-elles stockées ?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Les photos sont stockées temporairement sur des serveurs sécurisés pour permettre l'analyse IA. Elles sont automatiquement supprimées après un délai configurable. StudySnap respecte la vie privée des étudiants et ne partage jamais les images avec des tiers."
        }
      }
    ]
  }
